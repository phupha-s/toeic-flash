<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC FLASH</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- โหลด Firebase SDK แบบมาตรฐาน (v8) ตัดปัญหา Module Import พัง -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <h1>⚡ TOEIC FLASH</h1>
        <p>เกมตอบคำถาม TOEIC แบบ Multiplayer</p>

        <!-- หน้าเข้าห้อง / สร้างห้อง -->
        <div id="join-screen">
            <div class="form-group" style="margin-bottom: 15px;">
                <input type="text" id="player-name" placeholder="กรอกชื่อของคุณ" maxlength="12">
            </div>
            
            <div class="button-group" style="margin-bottom: 20px;">
                <button id="btn-create-room" type="button" onclick="handleCreateRoom()">+ สร้างห้อง</button>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

            <div class="form-group" style="display: flex; gap: 10px; justify-content: center;">
                <input type="text" id="room-code-input" placeholder="ใส่รหัสห้อง (5 หลัก)" maxlength="5">
                <button id="btn-join-room" type="button" onclick="handleJoinRoom()">🚀 เข้าร่วมเกม</button>
            </div>
        </div>

        <!-- หน้า Lobby รอเพื่อน -->
        <div id="lobby-screen" style="display: none;">
            <h2>ROOM: <span id="display-room-code">-----</span></h2>
            <div class="player-count-box" style="margin: 15px 0;">
                👥 ผู้เล่นในห้อง (<span id="player-count">0</span>/10)
            </div>
            <div id="player-list" class="player-list"></div>
            
            <button id="btn-start-game" style="display: none; margin-top: 20px;" onclick="handleStartGame()">🎮 START GAME</button>
        </div>
    </div>

    <script>
        // ตั้งค่า Firebase
        var firebaseConfig = {
            apiKey: "AIzaSyBVTZZvQuHAXY33U0PdyrJUA9f8zE6PJR8",
            authDomain: "toeic-flash.firebaseapp.com",
            databaseURL: "https://toeic-flash-default-rtdb.firebaseio.com",
            projectId: "toeic-flash",
            storageBucket: "toeic-flash.firebasestorage.app",
            messagingSenderId: "534176894744",
            appId: "1:534176894744:web:eed6def74094b4890f186d"
        };

        // เริ่มต้นใช้งาน Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        var db = firebase.database();

        function generateRoomCode() {
            var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            var result = '';
            for (var i = 0; i < 5; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // ฟังก์ชันสร้างห้อง
        function handleCreateRoom() {
            var nameInput = document.getElementById('player-name');
            var playerName = nameInput ? nameInput.value.trim() : '';
            
            if (!playerName) {
                alert("กรุณากรอกชื่อของคุณก่อนสร้างห้อง");
                return;
            }

            var roomCode = generateRoomCode();
            var roomRef = db.ref('rooms/' + roomCode);

            roomRef.set({
                createdAt: Date.now(),
                status: 'waiting',
                currentQuestion: 0
            }).then(function() {
                var playersRef = db.ref('rooms/' + roomCode + '/players');
                var newPlayerRef = playersRef.push();
                var playerId = newPlayerRef.key;

                newPlayerRef.set({
                    name: playerName,
                    isHost: true,
                    score: 0
                });

                localStorage.setItem('toeic_flash_room', roomCode);
                localStorage.setItem('toeic_flash_player', playerName);
                localStorage.setItem('toeic_flash_playerId', playerId);
                localStorage.setItem('toeic_flash_isHost', 'true');

                showLobby(roomCode, true);
            }).catch(function(err) {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อ Firebase: " + err.message);
            });
        }

        // ฟังก์ชันเข้าร่วมห้อง
        function handleJoinRoom() {
            var nameInput = document.getElementById('player-name');
            var codeInput = document.getElementById('room-code-input');
            
            var playerName = nameInput ? nameInput.value.trim() : '';
            var roomCode = codeInput ? codeInput.value.trim().toUpperCase() : '';

            if (!playerName || !roomCode) {
                alert("กรุณากรอกชื่อและรหัสห้องให้ครบถ้วน");
                return;
            }

            var roomRef = db.ref('rooms/' + roomCode);
            roomRef.once('value').then(function(snapshot) {
                if (snapshot.exists()) {
                    var playersRef = db.ref('rooms/' + roomCode + '/players');
                    var newPlayerRef = playersRef.push();
                    var playerId = newPlayerRef.key;

                    newPlayerRef.set({
                        name: playerName,
                        isHost: false,
                        score: 0
                    });

                    localStorage.setItem('toeic_flash_room', roomCode);
                    localStorage.setItem('toeic_flash_player', playerName);
                    localStorage.setItem('toeic_flash_playerId', playerId);
                    localStorage.setItem('toeic_flash_isHost', 'false');

                    showLobby(roomCode, false);
                } else {
                    alert("ไม่พบรหัสห้องนี้ กรุณาตรวจสอบอีกครั้ง");
                }
            }).catch(function(err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            });
        }

        // แสดงหน้า Lobby
        function showLobby(roomCode, isHost) {
            document.getElementById('join-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';
            document.getElementById('display-room-code').innerText = roomCode;

            var btnStart = document.getElementById('btn-start-game');
            if (btnStart) {
                btnStart.style.display = isHost ? 'inline-block' : 'none';
            }

            db.ref('rooms/' + roomCode + '/players').on('value', function(snapshot) {
                var players = snapshot.val();
                var playerListContainer = document.getElementById('player-list');
                playerListContainer.innerHTML = '';
                var count = 0;

                for (var key in players) {
                    count++;
                    var p = players[key];
                    var div = document.createElement('div');
                    div.style.padding = '8px';
                    div.style.margin = '4px 0';
                    div.style.background = '#f0f0f0';
                    div.style.borderRadius = '4px';
                    div.innerText = count + '. ' + p.name + (p.isHost ? ' 👑 (Host)' : '');
                    playerListContainer.appendChild(div);
                }

                document.getElementById('player-count').innerText = count;
            });

            db.ref('rooms/' + roomCode + '/status').on('value', function(snapshot) {
                if (snapshot.val() === 'playing') {
                    window.location.href = "play.html";

                }
            });
        }

        function handleStartGame() {
            var roomCode = localStorage.getItem('toeic_flash_room');
            if (roomCode) {
                db.ref('rooms/' + roomCode + '/status').set('playing');
            }
        }
    </script>
</body>
</html>
