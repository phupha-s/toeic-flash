<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC FLASH - Playing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div id="timer-display" style="font-size: 20px; font-weight: bold; color: #ff5555; margin-bottom: 10px;">
            ⏱️ เหลือเวลา: 60 วินาที
        </div>

        <h2 id="question-number">ข้อที่ 1</h2>
        <p id="question-text" style="font-size: 18px; margin: 20px 0;">กำลังโหลดคำถาม...</p>

        <div id="options-container" class="button-group" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- ปุ่มตัวเลือกคำตอบจะถูกสร้างตรงนี้ -->
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">

        <h3>📊 ลิฟต์คะแนน (Leaderboard)</h3>
        <div id="elevator-leaderboard"></div>
    </div>

    <!-- เรียกใช้สคริปต์แบบ Module ให้ถูกต้อง -->
    <script type="module" src="js/game.js"></script>
</body>
</html>
